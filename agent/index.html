<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PC監視エージェント</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#5b8dee">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="監視エージェント">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getDatabase, ref, set, update, onValue, push } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDp06yKrhhvRypue_iCfTzfqCbQEB9mCY4",
      authDomain: "lock-71e17.firebaseapp.com",
      databaseURL: "https://lock-71e17-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "lock-71e17",
      storageBucket: "lock-71e17.firebasestorage.app",
      messagingSenderId: "176191347557",
      appId: "1:176191347557:web:4a1621147d60075f049f8c"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    // ===== デバイスID =====
    function getDeviceId() {
      let id = localStorage.getItem("device_id");
      if (!id) {
        id = "PC_" + Math.random().toString(36).slice(2, 9).toUpperCase();
        localStorage.setItem("device_id", id);
      }
      return id;
    }

    function parseUA(ua) {
      let os = "不明";
      if (ua.includes("CrOS")) os = "Chrome OS";
      else if (ua.includes("Windows NT 10")) os = "Windows 10/11";
      else if (ua.includes("Windows")) os = "Windows";
      else if (ua.includes("Mac OS X")) os = "macOS";
      else if (ua.includes("Linux")) os = "Linux";
      else if (ua.includes("Android")) os = "Android";
      else if (ua.includes("iPhone") || ua.includes("iPad")) os = "iOS";
      let browser = "不明";
      if (ua.includes("Edg/")) browser = "Edge";
      else if (ua.includes("Chrome/")) browser = "Chrome";
      else if (ua.includes("Firefox/")) browser = "Firefox";
      else if (ua.includes("Safari/")) browser = "Safari";
      return { os, browser };
    }

    async function getIP() {
      try {
        const r = await fetch("https://api.ipify.org?format=json");
        const d = await r.json();
        return d.ip;
      } catch { return "取得失敗"; }
    }

    async function getBattery() {
      try {
        const bat = await navigator.getBattery();
        return Math.round(bat.level * 100);
      } catch { return null; }
    }

    const deviceId = getDeviceId();
    const { os, browser } = parseUA(navigator.userAgent);
    const savedLabel = localStorage.getItem("device_label") || deviceId;

    document.getElementById("device-label").textContent = savedLabel;
    document.getElementById("label-input").value = savedLabel;
    document.getElementById("device-id-text").textContent = deviceId;
    document.getElementById("device-os").textContent = os;
    document.getElementById("device-browser").textContent = browser;
    document.getElementById("device-screen").textContent = `${screen.width}×${screen.height}`;

    // ===== ハートビート =====
    async function sendHeartbeat() {
      const ip = await getIP();
      const battery = await getBattery();
      const label = localStorage.getItem("device_label") || deviceId;
      const data = {
        id: deviceId, label, os, browser,
        screen: `${screen.width}×${screen.height}`,
        lang: navigator.language,
        ip,
        lastSeen: Date.now(),
        ...(battery !== null ? { battery } : {})
      };
      await update(ref(db, `devices/${deviceId}`), data);
      setStatus(`送信: ${new Date().toLocaleTimeString("ja-JP")}`);
      if (battery !== null) {
        document.getElementById("device-battery").textContent = `🔋 ${battery}%`;
        document.getElementById("device-battery").style.display = "inline";
      }
    }

    // ===== URL履歴 =====
    let lastRecordedUrl = "";
    function recordUrl() {
      const url = location.href;
      if (url === lastRecordedUrl) return;
      lastRecordedUrl = url;
      push(ref(db, `devices/${deviceId}/urlHistory`), { url, ts: Date.now() });
    }

    function setStatus(msg) {
      document.getElementById("status").textContent = msg;
    }

    // ===== Firebaseコマンド監視 =====
    const lockScreen = document.getElementById("lock-screen");
    const lockTimeEl = document.getElementById("lock-time");
    const msgBanner = document.getElementById("msg-banner");

    // タイムスタンプは localStorage で永続化（ページリロード後も再実行しない）
    let openUrlHandled   = parseInt(localStorage.getItem("lastOpenUrlTs")   || "0");
    let showImageHandled = parseInt(localStorage.getItem("lastShowImageTs") || "0");
    let playAudioHandled = parseInt(localStorage.getItem("lastPlayAudioTs") || "0");
    let countdownInterval = null;
    let firstSnapshot = true;          // 起動直後の1回目は「過去の命令」なので実行しない
    const STALE_MS = 30 * 1000;        // 30秒より古い命令は無視

    // ===== ロック制御（全画面・キー制限・状態の永続化） =====
    const LOCK_KEY = "agent_locked", LOCK_MSG_KEY = "agent_lock_msg";
    const DEFAULT_LOCK_MSG = "このパソコンは管理者によってロックされています。";
    const lockHint = document.getElementById("lock-hint");
    const isLocked = () => lockScreen.style.display === "flex";

    async function enterFullscreen() {
      try {
        if (!document.fullscreenElement) await document.documentElement.requestFullscreen({ navigationUI: "hide" });
      } catch {}
      try { if (navigator.keyboard && navigator.keyboard.lock) await navigator.keyboard.lock(); } catch {}
      updateLockHint();
    }
    function exitFullscreen() {
      try { if (navigator.keyboard && navigator.keyboard.unlock) navigator.keyboard.unlock(); } catch {}
      try { if (document.fullscreenElement) document.exitFullscreen(); } catch {}
    }
    function updateLockHint() {
      lockHint.style.display = (isLocked() && !document.fullscreenElement) ? "block" : "none";
    }
    function applyLock(on, msg) {
      if (on) {
        const m = msg || DEFAULT_LOCK_MSG;
        lockScreen.style.display = "flex";
        document.getElementById("lock-msg").textContent = m;
        localStorage.setItem(LOCK_KEY, "1");
        localStorage.setItem(LOCK_MSG_KEY, m);
        history.pushState(null, "", location.href);
        enterFullscreen();
      } else {
        lockScreen.style.display = "none";
        localStorage.removeItem(LOCK_KEY);
        localStorage.removeItem(LOCK_MSG_KEY);
        exitFullscreen();
      }
      updateLockHint();
    }
    // ロック画面をクリック → 全画面に戻す（ユーザー操作が必要なため）
    lockScreen.addEventListener("click", enterFullscreen);
    document.addEventListener("fullscreenchange", updateLockHint);
    document.addEventListener("visibilitychange", () => { if (isLocked()) enterFullscreen(); });
    // ロック中はキー操作・右クリックを無効化
    window.addEventListener("keydown", e => { if (isLocked()) { e.preventDefault(); e.stopPropagation(); } }, true);
    window.addEventListener("contextmenu", e => { if (isLocked()) e.preventDefault(); }, true);

    // 前回ロック中だったなら、Firebase応答を待たずに即ロック（再起動・オフラインでも解除されない）
    if (localStorage.getItem(LOCK_KEY) === "1") {
      applyLock(true, localStorage.getItem(LOCK_MSG_KEY));
    }

    // ロック時計
    setInterval(() => {
      if (lockScreen.style.display === "flex") {
        lockTimeEl.textContent = new Date().toLocaleTimeString("ja-JP", { hour: "2-digit", minute: "2-digit", second: "2-digit" });
      }
    }, 1000);

    onValue(ref(db, `devices/${deviceId}`), snap => {
      const data = snap.val();
      if (!data) return;

      // 起動直後の1回目：残っている古い命令は「処理済み」として扱い、実行しない
      if (firstSnapshot) {
        firstSnapshot = false;
        openUrlHandled   = Math.max(openUrlHandled,   data.openUrlTs   || 0);
        showImageHandled = Math.max(showImageHandled, data.showImageTs || 0);
        playAudioHandled = Math.max(playAudioHandled, data.playAudioTs || 0);
        localStorage.setItem("lastOpenUrlTs",   openUrlHandled);
        localStorage.setItem("lastShowImageTs", showImageHandled);
        localStorage.setItem("lastPlayAudioTs", playAudioHandled);
        if (data.openUrl) update(ref(db, `devices/${deviceId}`), { openUrl: null, openUrlTs: null });
        if (data.showImageUrl) update(ref(db, `devices/${deviceId}`), { showImageUrl: null, showImageTs: null });
        if (data.playAudioUrl) update(ref(db, `devices/${deviceId}`), { playAudioUrl: null, playAudioTs: null });
        data.openUrl = data.showImageUrl = data.playAudioUrl = null;
      }
      const fresh = ts => ts && (Date.now() - ts) < STALE_MS;

      // ===== ロックダウン =====
      if (data.locked) {
        if (!isLocked() || document.getElementById("lock-msg").textContent !== (data.lockMessage || DEFAULT_LOCK_MSG)) {
          applyLock(true, data.lockMessage);
        }
      } else if (isLocked()) {
        applyLock(false);
      }

      // ===== メッセージ表示 =====
      if (data.pendingMessage && data.messageTs) {
        const lastShown = parseInt(localStorage.getItem("lastMsgTs") || "0");
        if (data.messageTs > lastShown) {
          msgBanner.style.display = "flex";
          document.getElementById("msg-text").textContent = data.pendingMessage;
          localStorage.setItem("lastMsgTs", data.messageTs);
        }
      } else if (!data.pendingMessage) {
        msgBanner.style.display = "none";
      }

      // ===== URL誘導 =====
      if (data.openUrl && data.openUrlTs && data.openUrlTs > openUrlHandled && fresh(data.openUrlTs)) {
        openUrlHandled = data.openUrlTs;
        localStorage.setItem("lastOpenUrlTs", openUrlHandled);
        const target = data.openUrl;
        // 命令を消してから移動（次回起動時に再度開かれないようにする）
        update(ref(db, `devices/${deviceId}`), { openUrl: null, openUrlTs: null })
          .finally(() => { location.href = target; });
      }

      // ===== 画像表示 =====
      if (data.showImageUrl && data.showImageTs && data.showImageTs > showImageHandled && fresh(data.showImageTs)) {
        showImageHandled = data.showImageTs;
        localStorage.setItem("lastShowImageTs", showImageHandled);
        const overlay = document.getElementById("image-overlay");
        document.getElementById("overlay-img").src = data.showImageUrl;
        overlay.style.display = "flex";
      } else if (!data.showImageUrl) {
        document.getElementById("image-overlay").style.display = "none";
      }

      // ===== 音声再生 =====
      if (data.playAudioUrl && data.playAudioTs && data.playAudioTs > playAudioHandled && fresh(data.playAudioTs)) {
        playAudioHandled = data.playAudioTs;
        localStorage.setItem("lastPlayAudioTs", playAudioHandled);
        const audio = document.getElementById("bg-audio");
        audio.src = data.playAudioUrl;
        audio.loop = !!data.playAudioLoop;
        audio.volume = data.audioVolume != null ? data.audioVolume : 1.0;
        audio.play().catch(() => {
          document.addEventListener("click", () => audio.play(), { once: true });
        });
      } else if (!data.playAudioUrl) {
        const audio = document.getElementById("bg-audio");
        audio.pause();
        audio.src = "";
      }

      // ===== Ping応答 =====
      if (data.pingRequest && data.pingRequest > (data.pingResponse || 0)) {
        update(ref(db, `devices/${deviceId}`), { pingResponse: Date.now() });
      }

      // ===== カウントダウンタイマー =====
      if (data.countdownEnd && data.countdownEnd > Date.now()) {
        startCountdown(data.countdownEnd, data.countdownLabel || "残り時間");
      } else {
        stopCountdown();
      }
    });

    // ロック中の戻るボタン・離脱ブロック
    window.addEventListener("popstate", () => {
      if (isLocked()) history.pushState(null, "", location.href);
    });
    window.addEventListener("beforeunload", e => {
      if (isLocked()) { e.preventDefault(); e.returnValue = ""; }
    });

    // メッセージバナーを閉じる
    document.getElementById("msg-close").addEventListener("click", () => {
      msgBanner.style.display = "none";
    });

    // 画像オーバーレイを閉じる
    document.getElementById("image-close").addEventListener("click", () => {
      document.getElementById("image-overlay").style.display = "none";
      update(ref(db, `devices/${deviceId}`), { showImageUrl: null });
    });

    // ===== カウントダウン =====
    function startCountdown(endTs, label) {
      const bar = document.getElementById("countdown-bar");
      document.getElementById("countdown-label").textContent = label;
      bar.style.display = "flex";
      if (countdownInterval) clearInterval(countdownInterval);
      function tick() {
        const left = Math.max(0, Math.ceil((endTs - Date.now()) / 1000));
        const m = Math.floor(left / 60);
        const s = left % 60;
        document.getElementById("countdown-time").textContent =
          `${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}`;
        bar.classList.toggle("urgent", left <= 30);
        if (left <= 0) {
          stopCountdown();
          update(ref(db, `devices/${deviceId}`), { countdownEnd: null });
        }
      }
      tick();
      countdownInterval = setInterval(tick, 500);
    }

    function stopCountdown() {
      if (countdownInterval) { clearInterval(countdownInterval); countdownInterval = null; }
      document.getElementById("countdown-bar").style.display = "none";
    }

    // ===== Service Worker（PWA） =====
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("sw.js").catch(console.error);
    }

    // ===== ラベル保存 =====
    document.getElementById("save-label").addEventListener("click", () => {
      const v = document.getElementById("label-input").value.trim();
      if (v) {
        localStorage.setItem("device_label", v);
        document.getElementById("device-label").textContent = v;
        sendHeartbeat();
        const ok = document.getElementById("save-ok");
        ok.style.display = "inline";
        setTimeout(() => ok.style.display = "none", 2000);
      }
    });
    document.getElementById("label-input").addEventListener("keydown", e => {
      if (e.key === "Enter") document.getElementById("save-label").click();
    });

    // ===== 起動 =====
    sendHeartbeat();
    recordUrl();
    setInterval(sendHeartbeat, 60 * 1000);
    setInterval(recordUrl, 5 * 1000);
  </script>
  <style>
    :root { --bg: #0b0d14; --surface: #13161f; --border: #252836; --accent: #5b8dee; --green: #2dd4a0; --red: #f1596b; --text: #dde3f0; --muted: #5a6380; }
    @media (prefers-color-scheme: light) {
      :root { --bg: #f0f2f9; --surface: #fff; --border: #dde3f0; --text: #111827; --muted: #6b7280; }
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--bg); color: var(--text); font-family: 'Inter', system-ui, sans-serif; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; }

    /* ===== ロック画面 ===== */
    #lock-screen {
      display: none; position: fixed; inset: 0; background: #000;
      flex-direction: column; align-items: center; justify-content: center;
      z-index: 99999; text-align: center; padding: 40px; user-select: none;
      pointer-events: all;
    }
    #lock-hint { display: none; position: absolute; bottom: 28px; left: 0; right: 0; font-size: 13px; color: rgba(255,255,255,.45); }
    .lock-icon { font-size: 72px; margin-bottom: 16px; animation: pulse 2s infinite; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.6} }
    #lock-time { font-size: 52px; font-weight: 700; color: #fff; margin-bottom: 10px; font-variant-numeric: tabular-nums; letter-spacing: 2px; }
    #lock-msg { font-size: 18px; font-weight: 600; color: rgba(255,255,255,.85); max-width: 500px; line-height: 1.6; margin-top: 10px; }

    /* ===== メッセージバナー ===== */
    #msg-banner {
      display: none; position: fixed; top: 0; left: 0; right: 0;
      background: var(--accent); color: #fff; padding: 12px 20px;
      align-items: center; gap: 12px; z-index: 1000; font-size: 14px; font-weight: 500;
    }
    #msg-text { flex: 1; }
    #msg-close { background: rgba(255,255,255,.2); border: none; color: #fff; font-size: 16px; cursor: pointer; border-radius: 50%; width: 24px; height: 24px; display: flex; align-items: center; justify-content: center; }

    /* ===== カウントダウンバー ===== */
    #countdown-bar {
      display: none; position: fixed; top: 0; left: 0; right: 0;
      background: #1a1a2e; color: #fff; padding: 10px 20px;
      align-items: center; justify-content: center; gap: 14px;
      z-index: 1500; font-size: 14px; font-weight: 600;
      border-bottom: 2px solid var(--accent);
    }
    #countdown-time { font-size: 26px; font-weight: 700; font-family: monospace; color: var(--accent); letter-spacing: 2px; }
    #countdown-bar.urgent { border-bottom-color: var(--red); }
    #countdown-bar.urgent #countdown-time { color: var(--red); animation: blink2 .6s infinite; }
    @keyframes blink2 { 0%,100%{opacity:1} 50%{opacity:.3} }

    /* ===== 画像オーバーレイ ===== */
    #image-overlay {
      display: none; position: fixed; inset: 0; background: rgba(0,0,0,.88);
      flex-direction: column; align-items: center; justify-content: center;
      z-index: 9000; padding: 20px;
    }
    #image-overlay img { max-width: 100%; max-height: 85vh; border-radius: 12px; box-shadow: 0 8px 40px rgba(0,0,0,.6); object-fit: contain; }
    #image-close {
      position: absolute; top: 16px; right: 16px;
      background: rgba(255,255,255,.15); border: none; color: #fff;
      font-size: 22px; cursor: pointer; border-radius: 50%;
      width: 40px; height: 40px; display: flex; align-items: center; justify-content: center;
    }
    #image-close:hover { background: rgba(255,255,255,.3); }

    /* ===== エージェントカード ===== */
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: 18px; padding: 28px; max-width: 420px; width: 100%; }
    .card-header { display: flex; align-items: center; gap: 14px; margin-bottom: 20px; }
    .card-icon { font-size: 36px; }
    .card-title h1 { font-size: 17px; font-weight: 700; }
    .card-title .sub { font-size: 11px; color: var(--muted); margin-top: 2px; }
    .badge { display: inline-flex; align-items: center; gap: 5px; background: rgba(45,212,160,.12); color: var(--green); border-radius: 20px; padding: 5px 14px; font-size: 12px; font-weight: 600; margin-bottom: 20px; }
    .badge-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--green); animation: blink 1.5s infinite; }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:.3} }
    .info-section { background: var(--bg); border-radius: 10px; padding: 12px 14px; margin-bottom: 14px; }
    .info-row { display: flex; justify-content: space-between; font-size: 11px; padding: 3px 0; }
    .info-label { color: var(--muted); }
    .info-value { font-weight: 500; color: var(--text); }
    .input-section { background: var(--bg); border-radius: 10px; padding: 12px 14px; margin-bottom: 10px; }
    .section-label { font-size: 10px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .5px; margin-bottom: 8px; }
    .input-row { display: flex; gap: 8px; }
    .input-row input { flex: 1; background: var(--surface); border: 1px solid var(--border); color: var(--text); padding: 8px 12px; border-radius: 8px; font-size: 13px; outline: none; font-family: inherit; }
    .input-row input:focus { border-color: var(--accent); }
    .input-row button { background: var(--accent); color: #fff; border: none; padding: 8px 14px; border-radius: 8px; font-size: 13px; cursor: pointer; font-weight: 600; }
    #save-ok { color: var(--green); font-size: 12px; margin-left: 6px; display: none; }
    #device-battery { display: none; font-size: 11px; color: var(--muted); }
    #status { font-size: 10px; color: var(--muted); text-align: center; margin-top: 8px; }
    .device-id-label { font-size: 10px; color: var(--muted); text-align: center; margin-top: 4px; font-family: monospace; }
  </style>
</head>
<body>

<!-- カウントダウンバー -->
<div id="countdown-bar">
  <span id="countdown-label">残り時間</span>
  <span id="countdown-time">00:00</span>
</div>

<!-- メッセージバナー -->
<div id="msg-banner">
  <span id="msg-text"></span>
  <button id="msg-close">×</button>
</div>

<!-- 音声プレーヤー（非表示） -->
<audio id="bg-audio" preload="none"></audio>

<!-- 画像オーバーレイ -->
<div id="image-overlay">
  <button id="image-close">✕</button>
  <img id="overlay-img" src="" alt="管理者から送信された画像">
</div>

<!-- ロック画面（最前面） -->
<div id="lock-screen">
  <div class="lock-icon">🔒</div>
  <div id="lock-time">--:--:--</div>
  <div id="lock-msg">このパソコンは管理者によってロックされています。</div>
  <div id="lock-hint">画面をクリックすると全画面に戻ります</div>
</div>

<!-- エージェントカード -->
<div class="card">
  <div class="card-header">
    <div class="card-icon">🖥️</div>
    <div class="card-title">
      <h1 id="device-label">読み込み中...</h1>
      <div class="sub">PC監視エージェント</div>
    </div>
  </div>
  <div class="badge"><span class="badge-dot"></span> 監視中</div>
  <div class="info-section">
    <div class="info-row"><span class="info-label">OS</span><span class="info-value" id="device-os">-</span></div>
    <div class="info-row"><span class="info-label">ブラウザ</span><span class="info-value" id="device-browser">-</span></div>
    <div class="info-row"><span class="info-label">解像度</span><span class="info-value" id="device-screen">-</span></div>
    <div class="info-row" style="margin-top:4px"><span id="device-battery"></span></div>
  </div>
  <div class="input-section">
    <div class="section-label">この端末の表示名</div>
    <div class="input-row">
      <input type="text" id="label-input" placeholder="例: 教室A-01">
      <button id="save-label">保存</button>
      <span id="save-ok">✓</span>
    </div>
  </div>
  <div id="status">初期化中...</div>
  <div class="device-id-label">ID: <span id="device-id-text"></span></div>
</div>

</body>
</html>
